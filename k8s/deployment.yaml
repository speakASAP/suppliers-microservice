apiVersion: apps/v1
kind: Deployment
metadata:
  name: suppliers-microservice
  namespace: statex-apps
  labels:
    app: suppliers-microservice
    managed-by: k8s-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: suppliers-microservice
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: suppliers-microservice
    spec:
      containers:
        - name: app
          image: localhost:5000/suppliers-microservice:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3202
              name: http
          env:
            - name: LOGGING_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: logging-ingest-credentials
                  key: LOGGING_SERVICE_TOKEN
          # CATALOG_SERVICE_TOKEN and WAREHOUSE_SERVICE_TOKEN are deliberately not
          # named here. They used to point at the hand-created
          # `stock-traceability-runtime-token` Secret, which shadowed ESO and so was
          # missed by every rotation. They now arrive via the secretRef below, which
          # means a Vault rotation actually reaches this pod.
          envFrom:
            - configMapRef:
                name: suppliers-microservice-config
            - secretRef:
                name: suppliers-microservice-secret
          startupProbe:
            httpGet:
              path: /api/health
              port: 3202
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3202
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3202
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"

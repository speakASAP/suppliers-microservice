apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: suppliers-microservice-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: suppliers-microservice-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/prod/suppliers-microservice
        property: DB_PASSWORD
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/auth-microservice
        property: JWT_SECRET
    - secretKey: PAYMENT_API_KEY
      remoteRef:
        key: secret/prod/suppliers-microservice
        property: PAYMENT_API_KEY
    - secretKey: PAYMENT_APPLICATION_ID
      remoteRef:
        key: secret/prod/suppliers-microservice
        property: PAYMENT_APPLICATION_ID
    - secretKey: PAYMENT_WEBHOOK_API_KEY
      remoteRef:
        key: secret/prod/suppliers-microservice
        property: PAYMENT_WEBHOOK_API_KEY
    # Per-pair RS256 service credentials (Session G, 2026-08-27). These replaced a
    # hand-created `stock-traceability-runtime-token` Secret that had no ExternalSecret,
    # no ownerReferences and no Vault source, held one HS256 token with
    # `global:superadmin` for BOTH lanes, and had been expired since 2026-06-24.
    # Least privilege per target: catalog's GET /api/products/:id needs only
    # `catalog:authenticated`, so the catalog lane carries `:service`, not `:admin`;
    # warehouse's POST /api/supplier-reconciliations is decorated WAREHOUSE_ADMIN_ROLES,
    # so `:readonly` cannot pass it and `:admin` is the narrowest role that works.
    - secretKey: CATALOG_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/suppliers-microservice
        property: CATALOG_SERVICE_TOKEN
    - secretKey: WAREHOUSE_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/suppliers-microservice
        property: WAREHOUSE_SERVICE_TOKEN
    # Ingest credential for posting credential self-reports to monitoring
    # (SERVICE_CREDENTIAL_PROBER_PLAN.md Task A). Not a probe credential: it
    # authenticates the report, never the lane being reported on.
    # MonitoringIngestGuard accepts this static string, the same one the deploy
    # queue borrows, so no new credential is minted for reporting.
    - secretKey: NOTIFICATION_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/suppliers-microservice
        property: NOTIFICATION_SERVICE_TOKEN
